services:
  - type: web
    name: vaultshare
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi init-db && gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
