{% extends "base.html" %}

{% block title %}Bad Request - VaultShare{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 text-center">
            <div class="card shadow-sm border-0 p-4 p-md-5">
                <i class="bi bi-exclamation-triangle-fill text-warning display-3 mb-3"></i>
                <h3 class="fw-bold">{{ error_title or "Bad Request" }}</h3>
                <p class="text-muted">
                    {{ error_message or "The server could not understand or process your request. Please check your submission and try again." }}
                </p>
                <div class="mt-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">Return Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
