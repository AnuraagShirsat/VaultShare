{% extends "base.html" %}

{% block title %}Unauthorized - VaultShare{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 text-center">
            <div class="card shadow-sm border-0 p-4 p-md-5">
                <i class="bi bi-shield-lock-fill text-danger display-3 mb-3"></i>
                <h3 class="fw-bold">Authentication Required</h3>
                <p class="text-muted">
                    You must be logged in to access this resource.
                </p>
                <div class="mt-3">
                    <a href="{{ url_for('auth.login') }}" class="btn btn-primary px-4">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
