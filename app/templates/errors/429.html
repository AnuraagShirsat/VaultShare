{% extends "base.html" %}

{% block title %}Too Many Requests - VaultShare{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 text-center">
            <div class="card shadow-sm border-0 p-4 p-md-5">
                <i class="bi bi-speedometer2 text-warning display-3 mb-3"></i>
                <h3 class="fw-bold">Too Many Requests</h3>
                <p class="text-muted">
                    You have exceeded the rate limit for this request. Please slow down and try again shortly.
                </p>
                <div class="mt-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">Return Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
