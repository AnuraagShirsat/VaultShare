{% extends "base.html" %}

{% block title %}File Too Large - VaultShare{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 text-center">
            <div class="card shadow-sm border-0 p-4 p-md-5">
                <i class="bi bi-file-earmark-x text-danger display-3 mb-3"></i>
                <h3 class="fw-bold">File Too Large</h3>
                <p class="text-muted">
                    The file you attempted to upload exceeds the maximum allowed size limit of 16 MB.
                </p>
                <div class="mt-3">
                    <a href="{{ url_for('documents.upload') }}" class="btn btn-primary px-4 me-2">Try Again</a>
                    <a href="{{ url_for('documents.index') }}" class="btn btn-outline-secondary">My Documents</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
